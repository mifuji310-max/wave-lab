<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Wave Lab Prototype</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1020; color: #f3f4f6; overflow: hidden; }
    header {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: #111827; border-bottom: 1px solid #25304a;
    }
    h1 { margin: 0; font-size: 18px; }
    .sub { font-size: 12px; opacity: .72; }
    main { height: calc(100dvh - 112px); position: relative; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #0a1226; }
    .hint {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(17,24,39,.82); border: 1px solid #334155; padding: 8px 12px;
      border-radius: 999px; font-size: 13px; pointer-events: none; white-space: nowrap;
    }
    footer {
      height: 56px; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
      padding: 8px; background: #111827; border-top: 1px solid #25304a;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    button {
      border: 1px solid #374151; border-radius: 10px; background: #1f2937;
      color: #f9fafb; font-weight: 700; font-size: 14px;
    }
    button:active { transform: translateY(1px); }
    #status {
      position: absolute; right: 10px; bottom: 10px; font-size: 11px;
      padding: 5px 8px; border-radius: 8px; background: rgba(0,0,0,.45);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Wave Lab</h1>
      <div class="sub">タップして波を起こす試作版</div>
    </div>
    <div class="sub">FDTD 2D</div>
  </header>

  <main>
    <canvas id="wave" aria-label="波のシミュレーション"></canvas>
    <div class="hint">水面をタップしてください</div>
    <div id="status">準備中</div>
  </main>

  <footer>
    <button id="toggle">一時停止</button>
    <button id="reset">リセット</button>
    <button id="mode">色表示</button>
    <button id="source">連続波: OFF</button>
  </footer>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("wave");
  const ctx = canvas.getContext("2d", { alpha: false });
  const toggleBtn = document.getElementById("toggle");
  const resetBtn = document.getElementById("reset");
  const modeBtn = document.getElementById("mode");
  const sourceBtn = document.getElementById("source");
  const statusEl = document.getElementById("status");

  const nx = 160;
  const ny = 240;
  const size = nx * ny;
  let prev = new Float32Array(size);
  let curr = new Float32Array(size);
  let next = new Float32Array(size);
  let running = true;
  let colorMode = true;
  let continuous = false;
  let t = 0;
  let last = performance.now();
  let fps = 0;

  const imageCanvas = document.createElement("canvas");
  imageCanvas.width = nx;
  imageCanvas.height = ny;
  const imageCtx = imageCanvas.getContext("2d", { alpha: false });
  const image = imageCtx.createImageData(nx, ny);

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
  }

  function idx(x, y) { return y * nx + x; }

  function pulse(gx, gy, amplitude = 2.2) {
    const radius = 5;
    for (let y = -radius; y <= radius; y++) {
      for (let x = -radius; x <= radius; x++) {
        const px = gx + x, py = gy + y;
        if (px < 2 || px >= nx - 2 || py < 2 || py >= ny - 2) continue;
        const d2 = x*x + y*y;
        curr[idx(px, py)] += amplitude * Math.exp(-d2 / 8);
      }
    }
  }

  function step() {
    const c2 = 0.34;
    const damping = 0.997;
    for (let y = 1; y < ny - 1; y++) {
      const row = y * nx;
      for (let x = 1; x < nx - 1; x++) {
        const i = row + x;
        const lap = curr[i-1] + curr[i+1] + curr[i-nx] + curr[i+nx] - 4 * curr[i];
        next[i] = (2 * curr[i] - prev[i] + c2 * lap) * damping;
      }
    }

    // 吸収境界の簡易減衰
    const border = 10;
    for (let y = 0; y < ny; y++) {
      for (let x = 0; x < nx; x++) {
        const d = Math.min(x, y, nx - 1 - x, ny - 1 - y);
        if (d < border) next[idx(x,y)] *= 0.82 + 0.018 * d;
      }
    }

    [prev, curr, next] = [curr, next, prev];
    t++;
    if (continuous && t % 4 === 0) {
      const phase = Math.sin(t * 0.22);
      pulse(Math.floor(nx * 0.5), Math.floor(ny * 0.28), phase * 0.6);
    }
  }

  function render() {
    const data = image.data;
    for (let i = 0; i < size; i++) {
      const v = Math.max(-1, Math.min(1, curr[i] * 0.65));
      const p = i * 4;
      if (colorMode) {
        if (v >= 0) {
          data[p] = 238;
          data[p+1] = Math.floor(238 - 150 * v);
          data[p+2] = Math.floor(238 - 190 * v);
        } else {
          const a = -v;
          data[p] = Math.floor(238 - 190 * a);
          data[p+1] = Math.floor(238 - 120 * a);
          data[p+2] = 255;
        }
      } else {
        const g = Math.floor(128 + 115 * v);
        data[p] = data[p+1] = data[p+2] = g;
      }
      data[p+3] = 255;
    }
    imageCtx.putImageData(image, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(imageCanvas, 0, 0, canvas.width, canvas.height);
  }

  function loop(now) {
    if (running) {
      for (let i = 0; i < 2; i++) step();
    }
    render();
    const dt = now - last;
    fps = fps * 0.9 + (1000 / Math.max(dt, 1)) * 0.1;
    last = now;
    statusEl.textContent = `${Math.round(fps)} FPS`;
    requestAnimationFrame(loop);
  }

  function pointFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: Math.max(1, Math.min(nx - 2, Math.floor((clientX - r.left) / r.width * nx))),
      y: Math.max(1, Math.min(ny - 2, Math.floor((clientY - r.top) / r.height * ny)))
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const p = pointFromEvent(e);
    pulse(p.x, p.y);
  });

  toggleBtn.addEventListener("click", () => {
    running = !running;
    toggleBtn.textContent = running ? "一時停止" : "再生";
  });

  resetBtn.addEventListener("click", () => {
    prev.fill(0); curr.fill(0); next.fill(0); t = 0;
  });

  modeBtn.addEventListener("click", () => {
    colorMode = !colorMode;
    modeBtn.textContent = colorMode ? "色表示" : "白黒表示";
  });

  sourceBtn.addEventListener("click", () => {
    continuous = !continuous;
    sourceBtn.textContent = `連続波: ${continuous ? "ON" : "OFF"}`;
  });

  addEventListener("resize", resize);
  resize();
  statusEl.textContent = "実行中";
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
